<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayefyKYC · Login — Backoffice Look</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --deep:    #004238;
  --deep-2:  #063a30;
  --deep-3:  #0a2f28;
  --mint:    #A8F898;
  --mint-ink:#0a3d1e;
  --paper:   #F3F7F4;
  --card:    #ffffff;
  --line:    #E4ECE7;
  --ink:     #0F2A22;
  --ink-2:   #5B7168;
  --r-lg:    22px;
  --r-md:    14px;
  --r-sm:    10px;
  --r-pill:  999px;
  --sh-card: 0 32px 64px rgba(0,0,0,.40), 0 8px 24px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.16);
  --sh-mint: 0 8px 22px rgba(168,248,152,.45);
  --dur: 180ms;
  --bounce: cubic-bezier(.34,1.4,.5,1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Inter", system-ui, sans-serif;
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: linear-gradient(145deg, var(--deep) 0%, #00281f 100%);
  position: relative;
  overflow: hidden;
}

/* Dot pattern */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(168,248,152,.20) 1px, transparent 1px);
  background-size: 26px 26px;
  pointer-events: none;
}

/* Card */
.login-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--sh-card);
  animation: slide-up-fade .5s var(--bounce) both;
}
@keyframes slide-up-fade {
  from { opacity: 0; transform: translateY(24px) scale(.98); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}

/* Dark header */
.card-header {
  background: linear-gradient(145deg, var(--deep), var(--deep-2));
  padding: 32px 32px 28px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.brand-mark {
  width: 36px;
  height: 36px;
  background: var(--mint);
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
  color: var(--mint-ink);
}
.card-tagline {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(168,248,152,.65);
}

/* White body */
.card-body {
  background: var(--card);
  padding: 28px 32px 32px;
}
.card-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -.4px;
  margin-bottom: 4px;
  text-align: center;
}
.card-sub {
  font-size: 13px;
  color: var(--ink-2);
  text-align: center;
  margin-bottom: 24px;
}

/* Form */
.form-group { margin-bottom: 16px; }
label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 6px;
}
.label-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.label-link {
  font-size: 12px;
  color: var(--ink-2);
  text-decoration: none;
  transition: color var(--dur) ease;
}
.label-link:hover { color: var(--ink); }

input[type=email], input[type=password] {
  width: 100%;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 0 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--ink);
  background: var(--card);
  outline: none;
  transition: border-color var(--dur) ease, box-shadow var(--dur) ease;
}
input:focus {
  border-color: rgba(168,248,152,.60);
  box-shadow: 0 0 0 4px rgba(168,248,152,.25);
}

/* Entrar button */
.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 52px;
  margin-top: 8px;
  background: var(--mint);
  color: var(--mint-ink);
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: var(--r-md);
  cursor: pointer;
  transition: all var(--dur) ease;
  box-shadow: 0 1px 2px rgba(15,42,34,.08);
}
.btn-primary:hover {
  background: #91f07e;
  transform: translateY(-2px);
  box-shadow: var(--sh-mint);
}
.btn-primary:active {
  transform: translateY(1px) scale(.99);
}

.register-link {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: var(--ink-2);
}
.register-link a {
  font-weight: 600;
  color: var(--deep);
  text-decoration: none;
}

/* Footer */
.page-footer {
  position: relative;
  z-index: 1;
  text-align: center;
  font-size: 11px;
  margin-top: 20px;
  color: rgba(168,248,152,.35);
  letter-spacing: .08em;
}

@media (prefers-reduced-motion: reduce) {
  *, .login-card { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div>
  <div class="login-card">
    <!-- Cabecera oscura -->
    <div class="card-header">
      <div class="brand-mark">P</div>
      <p class="card-tagline">Portal de Onboarding</p>
    </div>

    <!-- Cuerpo blanco -->
    <div class="card-body">
      <h1 class="card-title">Inicia sesión</h1>
      <p class="card-sub">Accede a tu expediente de onboarding</p>

      <form>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@empresa.com" autocomplete="email">
        </div>
        <div class="form-group">
          <div class="label-row">
            <label for="pwd" style="margin:0">Contraseña</label>
            <a href="#" class="label-link">¿Olvidaste tu contraseña?</a>
          </div>
          <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <p class="register-link">
        ¿No tienes cuenta? <a href="#">Regístrate</a>
      </p>
    </div>
  </div>

  <p class="page-footer">Payefy · KYC</p>
</div>

</body>
</html>
